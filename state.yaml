known_limitations:
  - B1: 消息数≤10 且单条工具输出巨大时 compact 无法压缩，理论可致上下文溢出；
    真实 1M 窗口+Bash 30K 截断下仅 Read 病态大文件可触达。README §8 必须覆盖。
  - B2: 极小窗口下旧段小于摘要时压缩不降反升，且摘要会被反复再摘要；
    每回合仅触发一次无死循环，真实窗口无实际影响。
