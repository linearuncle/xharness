<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>xharness</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧栏 -->
    <aside id="sidebar">
      <div class="sb-titlebar">
        <div class="sb-appname">xharness</div>
      </div>
      <nav class="sb-nav">
        <div class="sb-item primary" id="btn-new-conv"><span class="ic">✎</span>新对话</div>
      </nav>
      <div class="sb-scroll">
        <div id="sb-pinned-section" class="hidden">
          <div class="sb-section">置顶</div>
          <div id="sb-pinned"></div>
        </div>
        <div class="sb-section sb-projects-header">
          <span>项目</span>
          <span class="sb-section-actions">
            <span class="icon-btn" id="btn-add-project" title="添加项目">＋</span>
          </span>
        </div>
        <div id="sb-projects"></div>
      </div>
      <div class="sb-footer">
        <span class="avatar" id="avatar">x</span>
        <span id="username">xharness</span>
        <span class="icon-btn settings-gear" id="btn-settings" title="设置">⚙</span>
      </div>
    </aside>

    <!-- 主区 -->
    <main id="main">
      <div id="chat-header" class="hidden">
        <span class="ch-folder">▤</span>
        <span id="chat-title"></span>
        <span class="spacer"></span>
        <span class="icon-btn" id="btn-env" title="环境信息">☰</span>
      </div>

      <!-- 空状态 -->
      <section id="empty-state">
        <div class="main-drag-strip"></div>
        <div class="es-icon">
          <svg width="72" height="60" viewBox="0 0 72 60" fill="none">
            <path d="M20 12 C8 12 4 22 10 30 C2 34 6 48 16 48 L52 48 C66 48 68 34 58 30 C64 20 54 8 42 14 C38 6 26 6 20 12 Z" stroke="#111" stroke-width="3" fill="none" stroke-linejoin="round"/>
            <path d="M27 26 L34 32 L27 38" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M38 39 L48 39" stroke="#111" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="es-heading">要在 <u id="es-folder">…</u> 内开发什么?</h1>
        <div class="es-cards">
          <div class="es-card" data-prompt="探索并理解这个代码库的整体结构，给我一份导览。">
            <div class="es-card-icon" style="color:#3b82f6">🔭</div>
            <div>探索并理解代码</div>
          </div>
          <div class="es-card" data-prompt="我想构建一个新功能：">
            <div class="es-card-icon" style="color:#8b5cf6">🔨</div>
            <div>构建新功能、应用或工具</div>
          </div>
          <div class="es-card" data-prompt="审查当前代码并提出修改建议。">
            <div class="es-card-icon" style="color:#10b981">✅</div>
            <div>审查代码并提出修改建议</div>
          </div>
          <div class="es-card" data-prompt="帮我修复以下问题：">
            <div class="es-card-icon" style="color:#f97316">🐞</div>
            <div>修复问题和失败</div>
          </div>
        </div>
      </section>

      <!-- 会话流 -->
      <section id="chat-scroll" class="hidden">
        <div id="chat-list"></div>
      </section>

      <!-- 输入区 -->
      <section id="composer-wrap">
        <div id="context-bar">
          <span class="ctx-chip">▤ <span id="ctx-folder">—</span></span>
          <span class="ctx-chip">🖥 本地</span>
          <span class="ctx-chip" id="ctx-branch-chip">⎇ <span id="ctx-branch">—</span></span>
        </div>
        <div id="composer">
          <div id="popup" class="hidden"></div>
          <div id="attach-chips" class="hidden"></div>
          <textarea id="input" rows="1" placeholder="随心输入"></textarea>
          <div id="composer-bar">
            <span class="icon-btn" id="btn-plus" title="插入">＋</span>
            <span id="yolo-badge" title="YOLO 模式：所有工具直接执行，无确认、无沙箱">⚠ 完全访问</span>
            <span class="spacer"></span>
            <span id="model-label" title="模型与推理强度">… <span class="chev">▾</span></span>
            <button id="btn-send" title="发送">↑</button>
          </div>
          <div id="model-menu" class="hidden"></div>
          <div id="plus-menu" class="hidden">
            <div class="pm-item" id="pm-attach"><span class="pm-ic">📎</span>添加附件</div>
            <div class="pm-item" id="pm-mention"><span class="pm-ic">@</span>插入 @ 提及</div>
            <div class="pm-item" id="pm-slash"><span class="pm-ic">⧉</span>插入 / 命令</div>
          </div>
        </div>
      </section>

      <!-- 环境信息面板 -->
      <aside id="env-panel" class="hidden">
        <div class="env-title">环境信息 <span class="icon-btn" id="btn-env-close">✕</span></div>
        <div class="env-row" id="env-changes">🗇 变更</div>
        <div class="env-row">🖥 本地</div>
        <div class="env-row" id="env-branch">⎇ —</div>
        <div id="env-changes-list"></div>
      </aside>
    </main>
  </div>

  <!-- 设置界面（整窗覆盖） -->
  <div id="settings-view" class="hidden">
    <aside id="set-sidebar">
      <div class="set-titlebar"></div>
      <div class="sb-item primary" id="btn-settings-back"><span class="ic">←</span>返回工作区</div>
      <div class="sb-section">基础设置</div>
      <div class="sb-item active"><span class="ic">▤</span>模型设置</div>
    </aside>
    <main id="set-main">
      <h1>模型设置</h1>
      <p class="set-desc">管理模型供应商，配置后可在聊天时选择使用。API 格式固定为 Anthropic Messages。</p>
      <div id="set-card">
        <div id="prov-list">
          <div class="sb-section">默认</div>
          <div id="prov-builtin"></div>
          <div class="sb-section">自定义供应商</div>
          <div id="prov-custom"></div>
          <div class="prov-row add" id="btn-add-provider">＋ 添加供应商</div>
        </div>
        <div id="prov-detail"><!-- 动态渲染 --></div>
      </div>
    </main>
  </div>

  <!-- 添加模型弹窗 -->
  <div id="modal-backdrop" class="hidden">
    <div id="model-dialog">
      <div class="md-title">添加模型 <span class="icon-btn" id="md-close">✕</span></div>
      <label>模型 ID</label>
      <input id="md-model-id" placeholder="如 deepseek-v4-flash" />
      <label>上下文窗口</label>
      <input id="md-context" type="number" value="200000" />
      <div class="md-actions">
        <button class="btn" id="md-cancel">取消</button>
        <button class="btn primary" id="md-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
